
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026 ISSF Junior World Championship</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

min-height:100vh;

background:
radial-gradient(circle at top,#086,#00121c);

color:white;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

overflow-x:hidden;

}




body:before{

content:"";

position:fixed;

width:600px;
height:600px;

background:#00ffff;

filter:blur(170px);

opacity:.25;

top:-200px;
left:-200px;

animation:bg 8s infinite alternate;

}



@keyframes bg{

to{

transform:translate(600px,500px);

}

}




.container{

width:100%;

display:flex;

justify-content:center;

}




.card{


width:min(95%,950px);

background:#ffffff18;

backdrop-filter:blur(20px);

padding:25px;

border-radius:30px;

box-shadow:

0 0 50px #00eaff;


animation:open 1s;


}




@keyframes open{

from{

opacity:0;

transform:scale(.7);

}

to{

opacity:1;

transform:scale(1);

}

}







.image-box{

height:clamp(220px,45vw,430px);

width:100%;

border-radius:25px;

overflow:hidden;

position:relative;

box-shadow:0 0 40px #00eaff;


}




.image-box img{


width:100%;
height:100%;


object-fit:cover;


animation:zoom 8s infinite alternate;


}




@keyframes zoom{


to{

transform:scale(1.08);

}

}







.play-btn{


position:absolute;


top:50%;

left:50%;


transform:translate(-50%,-50%);



width:95px;

height:95px;



border-radius:50%;


background:#ff003c;



display:flex;

align-items:center;

justify-content:center;


font-size:45px;


cursor:pointer;



box-shadow:0 0 40px red;


animation:pulse 1.5s infinite;


}




@keyframes pulse{


50%{

transform:translate(-50%,-50%) scale(1.15);

}


}






.viewer{


position:absolute;


top:18px;

right:18px;



background:#000b;



padding:12px 18px;


border-radius:30px;


font-weight:bold;


}







.logo{


text-align:center;


font-size:65px;


margin:20px;


animation:float 2s infinite;


}




@keyframes float{


50%{

transform:translateY(-12px);

}


}







h1{


text-align:center;


font-size:clamp(28px,6vw,55px);



background:linear-gradient(90deg,#00ffff,#fff);


-webkit-background-clip:text;


color:transparent;


}





.subtitle{

text-align:center;

font-size:22px;

margin:15px;

}








.chat-box{


margin-top:20px;


height:300px;


overflow-y:auto;



background:#0008;



padding:15px;


border-radius:20px;



}




.comment{


display:flex;


gap:12px;


align-items:center;



background:#ffffff14;



padding:12px;


margin-bottom:12px;


border-radius:18px;


animation:new .5s;


}




@keyframes new{


from{


opacity:0;

transform:translateX(50px);


}


to{


opacity:1;


}


}







.profile{


width:50px;

height:50px;


border-radius:50%;


object-fit:cover;


border:2px solid white;


}




.name{


font-weight:bold;


color:#00ffff;


}




.text{


font-size:15px;

margin-top:5px;


}







.live{


display:block;


width:max-content;


margin:25px auto 10px;


background:#ff0033;


color:white;


padding:18px 45px;


border-radius:50px;


text-decoration:none;


font-size:22px;


font-weight:bold;


box-shadow:0 0 35px red;


animation:button 1.5s infinite;


}





@keyframes button{


50%{

transform:scale(1.1);

}

}





.footer{


text-align:center;


opacity:.7;


margin-top:20px;


font-size:14px;


}







@media(max-width:500px){


.card{

padding:15px;

}


.play-btn{

width:75px;

height:75px;

font-size:35px;

}


.viewer{

font-size:12px;

}


}





</style>


</head>



<body>



<div class="container">


<div class="card">





<div class="image-box">


<img src="https://www.thestatesman.com/wp-content/uploads/2025/07/Untitled-design-74-3.webp">



<div class="play-btn" onclick="openLive()">

▶

</div>



<div class="viewer">

👥 <span id="views">12453</span> Watching

</div>


</div>







<div class="logo">

🏆⚽

</div>




<h1>

2026 ISSF Junior World Championship

</h1>



<div class="subtitle">
live now

</div>





<div class="chat-box" id="chat">

</div>







<a class="live" onclick="openLive()">

🔴 WATCH LIVE

</a>




<div class="footer">

World Cup Live Experience 2026

</div>



</div>

</div>







<script>





function openLive(){

window.open(

"https://lofij.com/af?o=30f4bcf1bd348746de29448b383ff9bf:b90537fad5554736840784a5553f947c",

"_blank"

);

}








let users=[


{
country:"🇺🇸",
name:"Alex",
img:"https://i.pravatar.cc/100?img=12",
msg:"Amazing opening ceremony 🔥"
},



{
country:"🇨🇦",
name:"Ryan",
img:"https://i.pravatar.cc/100?img=15",
msg:"The stadium looks amazing ⚽"
},



{
country:"🇲🇽",
name:"Carlos",
img:"https://i.pravatar.cc/100?img=18",
msg:"Vamos World Cup ❤️"
},



{
country:"🇺🇸",
name:"Mike",
img:"https://i.pravatar.cc/100?img=25",
msg:"Watching this moment 🔥"
},



{
country:"🇨🇦",
name:"Emma",
img:"https://i.pravatar.cc/100?img=30",
msg:"Best football event 😍"
},



{
country:"🇲🇽",
name:"Luis",
img:"https://i.pravatar.cc/100?img=35",
msg:"Football fever everywhere ⚽"
}



];







let chat=document.getElementById("chat");





function addComment(){


let u=users[Math.floor(Math.random()*users.length)];



chat.innerHTML +=`


<div class="comment">


<img class="profile" src="${u.img}">



<div>


<div class="name">

${u.country} ${u.name}

</div>



<div class="text">

${u.msg}

</div>



</div>



</div>


`;



chat.scrollTop=chat.scrollHeight;


}






for(let i=0;i<8;i++){

addComment();

}







setInterval(()=>{


addComment();


},2500);









let view=12453;


setInterval(()=>{


view += Math.floor(Math.random()*20)-5;


document.getElementById("views").innerHTML=view;


},1000);





</script>



</body>

</html>
